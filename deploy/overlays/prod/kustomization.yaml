apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bok
resources:
  - namespace.yaml
  - ../../base
images:
  - name: bok
    newName: git.mwsz.org/milek/bok
    newTag: "0.2.0"
configMapGenerator:
  - name: bok-config
    envs: [config.env]
secretGenerator:
  # secrets.env is gitignored — copy secrets.env.example and fill it in.
  - name: bok-secrets
    envs: [secrets.env]
