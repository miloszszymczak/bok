# Web: SvelteKit (UI + API). Expose Service "bok-web" (port 80) with your own IngressRoute.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bok-web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: bok-web }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bok-web }
    spec:
      imagePullSecrets:
        - name: bok-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: bok-web }
      # Migrations run under a Postgres advisory lock, so parallel pods are safe.
      initContainers:
        - name: migrate
          image: bok
          command: ["node", "apps/worker/dist/migrate.js"]
          envFrom:
            - configMapRef: { name: bok-config }
            - secretRef: { name: bok-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
      containers:
        - name: web
          image: bok
          ports:
            - { name: http, containerPort: 3000 }
          env:
            - { name: SERVICE_NAME, value: bok-web }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=384" }
          envFrom:
            - configMapRef: { name: bok-config }
            - secretRef: { name: bok-secrets }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bok-web
spec:
  selector: { app.kubernetes.io/name: bok-web }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bok-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bok-web }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bok-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: bok-web }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
